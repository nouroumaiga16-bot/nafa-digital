<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nafa Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-css">:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F7F8F8; --ink:#161513; --muted:#5E5A52; --line:#E2DED5;
  --indigo:#161513; --link:#8A6A12; --gold:#D4AF37; --gold-ink:#161513; --green:#0E7A4A; --danger:#B3261E;
  --chip:#EEF0F0; --shadow:0 1px 2px rgba(20,23,38,.06),0 8px 24px rgba(20,23,38,.07);
  --nav:#121110; --nav2:#1D1B18;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0B0A; --surface:#171614; --surface2:#1E1C19; --ink:#F1EDE4; --muted:#ABA496; --line:#2E2B26;
    --link:#E2C36B; --green:#40C98C; --danger:#FF8A80; --chip:#26231F; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0B0A; --surface:#171614; --surface2:#1E1C19; --ink:#F1EDE4; --muted:#ABA496; --line:#2E2B26;
  --link:#E2C36B; --green:#40C98C; --danger:#FF8A80; --chip:#26231F; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none}

/* ----- signature woven band (Faso Dan Fani) ----- */
.weave{height:10px;background:repeating-linear-gradient(90deg,#121110 0 18px,#D4AF37 18px 22px,#F4EEDD 22px 24px,#8C6A2B 24px 36px,#D4AF37 36px 40px,#121110 40px 62px,#F4EEDD 62px 64px)}
.weave.tall{height:18px}

/* ----- announcement + header ----- */
.announce{background:var(--gold);color:var(--gold-ink);font-size:.88rem;font-weight:700;text-align:center;padding:7px 14px}
.hdr{position:sticky;top:0;z-index:40;background:var(--nav);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.hdr-row{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:baseline;gap:6px;background:none;border:0;color:#fff;padding:4px 2px;white-space:nowrap}
.logo b{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.logo span{font-family:var(--display);font-weight:500;font-size:.8rem;color:var(--gold)}
.search{flex:1;position:relative;display:flex;max-width:720px}
.search input{flex:1;min-width:0;border:0;border-radius:12px 0 0 12px;padding:11px 14px;background:#fff;color:#141726}
.search button{border:0;border-radius:0 12px 12px 0;background:var(--gold);color:var(--gold-ink);padding:0 16px;display:grid;place-items:center}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;z-index:50}
.sugg:empty{display:none}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 14px;text-align:left}
.sugg button:hover,.sugg button:focus-visible{background:var(--chip)}
.sugg .mini{width:30px;height:40px;border-radius:5px;overflow:hidden;flex:none}
.sugg small{color:var(--muted);display:block}
.hdr-actions{display:flex;align-items:center;gap:6px}
.hbtn{background:none;border:0;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-weight:700;position:relative}
.hbtn:hover{background:rgba(255,255,255,.08)}
.count{position:absolute;top:0;left:22px;background:var(--gold);color:var(--gold-ink);font-size:.72rem;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.subnav{background:var(--nav2)}
.subnav .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:4px;padding-bottom:4px;scrollbar-width:none}
.subnav button{background:none;border:0;color:#E9E3D3;padding:7px 12px;border-radius:8px;white-space:nowrap;font-weight:600;font-size:.92rem}
.subnav button:hover,.subnav button[aria-current="true"]{background:rgba(255,255,255,.1);color:#fff}
@media (max-width:760px){
  .hdr-row{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .hdr-actions{margin-left:auto}
  .hbtn .lbl{display:none}
}

/* ----- hero ----- */
.hero{background:radial-gradient(120% 90% at 85% 10%,#2A2620 0%,#121110 60%);color:#fff}
.hero-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center;padding-top:48px;padding-bottom:52px}
.hero .sig{font-weight:600;color:var(--gold);margin:0 0 14px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,6.4vw,4.6rem);line-height:1;letter-spacing:-.025em;margin:0 0 18px;max-width:14ch}
.hero .lead{font-size:clamp(1.02rem,2.2vw,1.2rem);color:#D9D3C3;max-width:44ch;margin:0 0 26px}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap}
.spot{background:#1D1B18;color:#F1EDE4;border:1px solid rgba(212,175,55,.45);border-radius:22px;padding:18px;display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.spot .tag{font-size:.8rem;font-weight:800;color:var(--gold)}.spot .old{color:#ABA496}.spot .btn.dark{background:var(--gold);color:#161513}.spot .cover.sm.fb strong{font-size:.78rem}
.spot h2{font-size:1.05rem;line-height:1.3;margin:4px 0 8px}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr;gap:28px;padding-top:34px}}

/* ----- buttons ----- */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.dark{background:var(--nav);color:#fff}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.hero .btn.line{border-color:rgba(255,255,255,.4);color:#fff}
.btn.wa{background:#1FA855;color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ----- trust strip ----- */
.trust{background:var(--surface);border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-top:20px;padding-bottom:20px}
.trust div{display:flex;gap:12px;align-items:flex-start}
.trust svg{width:26px;height:26px;color:var(--gold);flex:none;margin-top:2px}
.trust b{display:block;font-size:.95rem}
.trust span{color:var(--muted);font-size:.86rem}
@media (max-width:900px){.trust .wrap{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.trust .wrap{grid-template-columns:1fr}}

/* ----- sections ----- */
.sec{padding:34px 0 8px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:700;font-size:clamp(1.2rem,2.8vw,1.6rem);margin:0;letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tile{border:1px solid rgba(212,175,55,.35);border-radius:16px;color:#fff;padding:18px 16px;text-align:left;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:var(--c)}
.tile::after{content:"";position:absolute;right:-20px;bottom:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.08)}
.tile b{color:#E9CD7A;font-family:var(--display);font-weight:700;font-size:1.02rem}
.tile span{font-size:.85rem;opacity:.85}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.toolbar p{margin:0;color:var(--muted);font-size:.93rem}
.toolbar select{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card-link{border:0;padding:0;background:none;display:block;width:100%}
.badge{position:absolute;top:12px;left:12px;background:var(--gold);color:var(--gold-ink);font-size:.76rem;font-weight:800;padding:4px 10px;border-radius:999px;z-index:2}
.card-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.cat{font-size:.8rem;color:var(--muted);font-weight:700}
.card h3{margin:0;font-size:1rem;line-height:1.3}
.tlink{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink)}
.tlink:hover{color:var(--link);text-decoration:underline}
.pricing{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.price{font-family:var(--display);font-weight:700;font-size:1.1rem}
.old{color:var(--muted);font-size:.9rem}
.off{background:#FDE7E4;color:#9E1F17;font-weight:800;font-size:.78rem;padding:2px 7px;border-radius:6px}
.card .btn{margin-top:10px}
.in-cart{background:var(--chip);color:var(--ink)}

.stars{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.stars i{font-style:normal;letter-spacing:1px;background:linear-gradient(90deg,var(--gold) var(--p),#C9CCD8 var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1rem}

.cover{position:relative;overflow:hidden;aspect-ratio:3/4;background:var(--c,#131A4F)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.fb{display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;text-align:left}
.cover.fb .weave{position:absolute;top:0;left:0;right:0;height:12px}
.cover.fb strong{color:#E9CD7A;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.18;letter-spacing:-.01em}
.cover.fb span{font-size:.78rem;opacity:.75;margin-top:10px}
.cover.lg.fb{padding:28px}
.cover.lg.fb strong{font-size:clamp(1.4rem,3vw,2rem)}
.cover.lg{border-radius:18px;box-shadow:var(--shadow)}
.spot .cover{border-radius:10px}
.cover.xs{border-radius:6px}
.cover.xs.fb{padding:4px}
.cover.xs.fb strong,.cover.xs.fb span{display:none}
.cover.xs.fb .weave{height:5px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:34px;text-align:center;color:var(--muted)}

/* ----- reviews ----- */
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.review{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.review p{margin:10px 0 12px}
.review footer{color:var(--muted);font-size:.88rem}
.review footer b{color:var(--ink)}

/* ----- how + faq ----- */
.how{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;padding-left:54px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:40px;height:40px;border-radius:50%;background:var(--nav);color:var(--gold);font-family:var(--display);font-weight:800;display:grid;place-items:center}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.94rem}
.faq{display:grid;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.faq summary{font-weight:700;padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0 0 14px;color:var(--muted)}

/* ----- product page ----- */
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted);padding:18px 0 6px}
.crumbs button{background:none;border:0;padding:0;color:var(--link);font-weight:600}
.pgrid{display:grid;grid-template-columns:minmax(240px,380px) 1fr minmax(260px,320px);gap:30px;align-items:start;padding:10px 0 20px}
.pcover{position:sticky;top:140px;display:grid;gap:12px}
.pinfo h1{font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;margin:4px 0 8px;letter-spacing:-.01em}
.pinfo .sub{font-size:1.08rem;color:var(--muted);margin:0 0 10px}
.pinfo .by{font-size:.93rem;margin:0 0 10px}
.pinfo hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.desc p{margin:0 0 12px}
.learn{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:9px}
.learn li{display:flex;gap:10px}
.learn svg{color:var(--green);width:20px;height:20px;flex:none;margin-top:3px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:.94rem;margin-top:14px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-weight:600}
.buybox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;position:sticky;top:140px;box-shadow:var(--shadow)}
.buybox .price{font-size:1.7rem}
.buybox .save{color:var(--green);font-weight:700;font-size:.93rem;margin:4px 0 0}
.buybox .deliv{margin:14px 0;font-size:.93rem}
.buybox .deliv b{color:var(--green)}
.buybox .btns{display:grid;gap:10px;margin:14px 0}
.tlist{list-style:none;padding:14px 0 0;margin:0;border-top:1px solid var(--line);display:grid;gap:10px;font-size:.9rem}
.tlist li{display:flex;gap:10px;align-items:flex-start}
.tlist svg{width:18px;height:18px;color:var(--gold);flex:none;margin-top:2px}
.pmethods{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pm{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;background:var(--chip);padding:4px 10px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.orange{background:#FF7900}.dot.moov{background:#0A6FD6}.dot.wave{background:#1DC8FF}.dot.card{background:#E8A417}
@media (max-width:1060px){.pgrid{grid-template-columns:minmax(220px,340px) 1fr}.buybox{grid-column:1/-1;position:static}}
@media (max-width:700px){.pgrid{grid-template-columns:1fr}.pcover{position:static;max-width:320px;margin:0 auto;width:100%}}
.mbar{display:none}
@media (max-width:700px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
  .has-mbar{padding-bottom:84px}
}

/* ----- cart drawer ----- */
.scrim{position:fixed;inset:0;background:rgba(8,10,28,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--surface);z-index:61;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:1.15rem}
.x{background:var(--chip);border:0;border-radius:50%;width:36px;height:36px;font-size:1rem;flex:none}
.dbody{flex:1;overflow-y:auto;padding:14px 20px;display:grid;align-content:start;gap:12px}
.cline{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.cline .book{width:52px}
.cline b{display:block;font-size:.95rem;line-height:1.3}
.cline small{color:var(--muted)}
.rm{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px}
.dfoot{border-top:1px solid var(--line);padding:16px 20px;display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-family:var(--display);font-size:1.2rem}

/* ----- checkout ----- */
.cgrid{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start;padding:10px 0 40px}
@media (max-width:900px){.cgrid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.panel h2{font-size:1.08rem;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.panel h2 .n{width:28px;height:28px;border-radius:50%;background:var(--nav);color:var(--gold);font-family:var(--display);font-size:.85rem;display:grid;place-items:center}
.summary{position:sticky;top:140px}
.f{display:block;font-weight:700;font-size:.9rem;margin:12px 0 6px}
.in{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 13px}
textarea.in{min-height:96px;resize:vertical}
.hint{color:var(--muted);font-size:.86rem;margin:6px 0 0}
.err{color:var(--danger);font-size:.9rem;font-weight:600;margin:8px 0 0;min-height:1em}
.methods{display:grid;gap:10px}
.method{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:transparent;text-align:left;width:100%}
.method[aria-pressed="true"]{border-color:var(--gold);background:rgba(232,164,23,.1)}
.method b{display:block}
.method small{color:var(--muted)}
.paybox{background:var(--nav);color:#fff;border-radius:14px;padding:16px;margin-top:14px}
.paybox .num{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.03em}
.paybox .amt{color:var(--gold);font-family:var(--display);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.promo{display:flex;gap:8px;margin-top:12px}
.promo .in{padding:9px 12px}
.sumrow{display:flex;justify-content:space-between;font-size:.95rem;margin-top:8px}
.sumrow.disc{color:var(--green);font-weight:700}
.sumrow.total{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;font-weight:800}
.sumrow.total span:last-child{font-family:var(--display);font-size:1.25rem}
.warn{background:rgba(232,164,23,.14);border-radius:12px;padding:12px 14px;font-size:.92rem}
.okmsg{color:var(--green);font-weight:700;font-size:.9rem;margin:6px 0 0}

/* ----- thanks ----- */
.thanks{max-width:640px;margin:30px auto 50px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.thanks .in-pad{padding:28px}
.thanks h1{font-family:var(--display);font-size:1.6rem;margin:0 0 8px}
.ordno{display:inline-block;background:var(--chip);padding:6px 12px;border-radius:10px;font-weight:800;letter-spacing:.04em}

/* ----- footer ----- */
.foot{background:var(--nav);color:#CFC8B6;margin-top:44px}
.foot .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:26px;padding-top:34px;padding-bottom:30px}
.foot h3{color:#fff;font-size:.98rem;margin:0 0 10px}
.foot button,.foot a{display:block;background:none;border:0;padding:4px 0;color:#CFC8B6;text-align:left;text-decoration:none;font-size:.92rem}

/* ----- Amazon-style top carousel ----- */
.top{background:linear-gradient(180deg,#121110 0%,#1D1B18 62%,var(--bg) 62.1%)}

.sl-dark{background:radial-gradient(120% 80% at 80% 100%,#3A3222 0%,#121110 70%);border:1px solid rgba(212,175,55,.4)}

/* ===== Amazon conversion system ===== */
:root{--cta:#FFD814;--cta-b:#FCD200;--buy:#FFA41C;--buy-b:#FF8F00;--deal:#CC0C39;--ok:#067D62;--bs:#E47911}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok:#3CC9A0;--deal:#FF5C7A}}
:root[data-theme="dark"]{--ok:#3CC9A0;--deal:#FF5C7A}
.btn.cart{background:var(--cta);border:1px solid var(--cta-b);color:#0F1111;border-radius:999px;font-weight:700;box-shadow:0 2px 5px rgba(213,217,217,.5)}
.btn.cart:hover{background:#F7CA00}
.btn.buy{background:var(--buy);border:1px solid var(--buy-b);color:#0F1111;border-radius:999px;font-weight:700;box-shadow:0 2px 5px rgba(213,217,217,.5)}
.btn.buy:hover{background:#FA8900}
.btn.in-cart{border-radius:999px;background:var(--chip);color:var(--ok);font-weight:700;border:1px solid var(--line)}
.off{background:var(--deal);color:#fff}
.ending{color:var(--deal)}
.badge.bsb,.bsb{background:var(--bs);color:#fff;font-weight:800;font-size:.76rem;padding:3px 9px;border-radius:4px}
.bsline{margin:0 0 10px;font-size:.9rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cdeliv{font-size:.8rem;color:var(--ok);font-weight:700}
.buybox .dealline{margin:0 0 6px}
.dealtag{background:var(--deal);color:#fff;font-size:.8rem;font-weight:800;padding:4px 9px;border-radius:4px}
.bprice{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bprice .pct{color:var(--deal);font-size:1.6rem;font-weight:300}
.bprice .price{font-size:1.75rem}
.listp{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.buybox .deliv{margin:14px 0 4px;font-size:.93rem}
.buybox .deliv b{color:var(--ok)}
.stock{color:var(--ok);font-weight:700;font-size:1.05rem;margin:6px 0 0}
.buybox .btns{gap:8px}
.sold{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.84rem;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.sold dt{color:var(--muted)}.sold dd{margin:0}
.added{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-weight:800}
.added svg{width:22px;height:22px}
.dsum{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:6px}
.dsug{font-size:1rem;margin:14px 0 2px}
.goal{margin-top:12px;font-size:.88rem}
.goal.ok{display:flex;gap:8px;align-items:center;color:var(--ok);font-weight:600}
.goal.ok svg{width:18px;height:18px}
.gbar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--buy),var(--cta))}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: no-preference){.count.bump{animation:bump .45s ease}}
.stars i{background:linear-gradient(90deg,var(--buy) var(--p),#C9CCD8 var(--p));-webkit-background-clip:text;background-clip:text}

/* ----- extract reader ----- */
.peek{position:absolute;top:12px;left:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;background:#121110;color:#E9CD7A;border:1px solid rgba(212,175,55,.5);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.82rem}

.reader.open{display:flex}
.rd-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:#121110;color:#fff}

function saveCart(){LS.set('cart',cart);}
function addToCart(id,silent){
  if(!findP(id))return;
  if(!inCart(id)){cart.push(id);saveCart();ui.bump=true;}
  if(!silent){ui.justAdded=id;ui.cartOpen=true;}
}
function removeFromCart(id){cart=cart.filter(function(x){return x!==id;});saveCart();}
function promoObj(){
  var c=ui.promo.trim().toUpperCase(); if(!c)return null;
  for(var i=0;i<D.promos.length;i++){var p=D.promos[i];if(p.active&&String(p.code||'').trim().toUpperCase()===c&&Number(p.percent)>0)return p;}
  return null;
}
function packRule(){var s=D.settings,m=parseInt(s.packMin,10)||0,pc=parseInt(s.packPercent,10)||0;return (m>1&&pc>0)?{min:m,pc:Math.min(50,pc)}:null;}
function totals(){
  var items=cart.map(findP).filter(Boolean);
  var sub=items.reduce(function(a,p){return a+eff(p);},0);
  var pk=packRule(), pd=(pk&&items.length>=pk.min)?Math.round(sub*pk.pc/100):0, after=sub-pd;
  var pr=promoObj(); var d=pr?Math.round(after*Math.min(90,Number(pr.percent))/100):0;
  return {items:items,sub:sub,pack:pd,packRule:pk,disc:d,total:after-d,promo:pr};
}
function goalHTML(t){
  var pk=t.packRule; if(!pk||!t.items.length)return '';
  if(t.items.length>=pk.min)return '<div class="goal ok">'+IC.check+'<span>Bravo ! Tu économises <b>'+pk.pc+' %</b> sur toute ta commande.</span></div>';
  var need=pk.min-t.items.length, pct=Math.round(t.items.length/pk.min*100);
  return '<div class="goal"><span>Ajoute encore <b>'+need+' guide'+(need>1?'s':'')+'</b> et économise <b>'+pk.pc+' %</b> sur toute ta commande</span><div class="gbar"><i style="width:'+pct+'%"></i></div></div>';
}
function bestIn(p){
  var n=Number(p.monthlySales)||0; if(n<5)return false;
  return !D.products.some(function(x){return x.id!==p.id&&x.category===p.category&&(Number(x.monthlySales)||0)>n;});
}

/* ---------- extract reader ---------- */
function mdLite(t){
  var out='',list=false;
  String(t||'').split('\n').forEach(function(raw){
    var l=raw.trim();
    if(!l.indexOf('- ')){if(!list){out+='<ul>';list=true;}out+='<li>'+inline(l.slice(2))+'</li>';return;}
    if(list){out+='</ul>';list=false;}
    if(!l)return;
    if(!l.indexOf('## '))out+='<h3>'+inline(l.slice(3))+'</h3>';
    else if(!l.indexOf('# '))out+='<h2>'+inline(l.slice(2))+'</h2>';
    else if(!l.indexOf('!> '))out+='<div class="rd-hl">'+inline(l.slice(3))+'</div>';
    else if(!l.indexOf('? '))out+='<p class="rd-src">'+inline(l.slice(2))+'</p>';
    else out+='<p>'+inline(l)+'</p>';
  });
  if(list)out+='</ul>';
  return out;
}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function openReader(id){
  var p=findP(id); if(!p||!p.extractText)return;
  var el=document.getElementById('reader'); if(!el){el=document.createElement('div');el.id='reader';document.body.appendChild(el);}
  var o=disc(p), ic=inCart(p.id);
  el.className='reader open'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Extrait gratuit : '+p.title);
  el.innerHTML='<div class="rd-head"><div><span class="rd-k">Extrait gratuit</span><b>'+esc(p.title)+'</b></div><button type="button" class="x" data-closeread aria-label="Fermer l\'extrait">✕</button></div>'
    +'<div class="rd-body"><div class="rd-in">'+mdLite(p.extractText)
    +'<div class="rd-end"><b>Tu as aimé cet extrait ?</b><span>La suite t\'attend dans le guide complet.</span></div></div></div>'
    +'<div class="rd-bar"><div class="mb-l"><div class="mb-p">'+(o?'<span class="pct">-'+o+' %</span>':'')+'<span class="price">'+money(eff(p))+'</span></div>'+(daysLeft(p)?'<span class="mb-e">Fin dans '+daysLeft(p)+' j</span>':'<span class="mb-d">Livraison automatique</span>')+'</div>'
    +'<div class="rd-btns"><button type="button" class="btn cart" data-readadd="'+esc(p.id)+'">'+(ic?'Dans le panier ✓':'Ajouter au panier')+'</button><button type="button" class="btn buy" data-readbuy="'+esc(p.id)+'">Acheter maintenant</button></div></div>';
  document.documentElement.style.overflow='hidden';
  var x=el.querySelector('.x'); if(x)x.focus();
}
function closeReader(){var el=document.getElementById('reader');if(el){el.className='reader';el.innerHTML='';}document.documentElement.style.overflow='';}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-read],[data-closeread],[data-readadd],[data-readbuy]'); if(!t)return;
  var d=t.dataset;
  if(d.read!==undefined){openReader(d.read);return;}
  if(d.closeread!==undefined){closeReader();return;}
  if(d.readadd!==undefined){closeReader();addToCart(d.readadd);render();return;}
  if(d.readbuy!==undefined){closeReader();var _rbp=findP(d.readbuy);if(_rbp&&_rbp.selar){window.open(_rbp.selar,'_blank');return;}addToCart(d.readbuy,true);go('checkout');return;}
},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var el=document.getElementById('reader');if(el&&el.classList.contains('open'))closeReader();}});

/* ---------- search suggestions ---------- */
function suggest(v){
  var box=$('#sugg'); if(!box)return;
  var q=v.trim().toLowerCase();

  if(d.closecart!==undefined&&d.go===undefined){ui.cartOpen=false;ui.justAdded=null;render();return;}
  if(d.go!==undefined){if(d.go==='home'){ui.cat='Tous';ui.q='';}go(d.go);return;}
  if(d.cat!==undefined){ui.cat=d.cat;ui.q='';ui.route='home';setHash('');render();var c=document.getElementById('catalogue');if(c)c.scrollIntoView();return;}

function resizeImage(file){
  return new Promise(function(res,rej){
    var r=new FileReader(); r.onerror=rej;
    r.onload=function(){var img=new Image();img.onerror=rej;img.onload=function(){
      var W=800,sc=Math.min(1,W/img.width),c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8));
    };img.src=r.result;};
    r.readAsDataURL(file);
  });
}

      editing=null;tab='produits';drawAdmin('Produit enregistré. Clique sur « Publier les changements » pour le mettre en ligne.');
    },function(){t.disabled=false;t.textContent='Enregistrer le produit';er.textContent='Cette image n\'a pas pu être lue. Essaie une image JPG ou PNG.';});
    return;
  }
  if(d.publish!==undefined){
    var st=$('#a-status',adm);
    if(!artifactNs){st.textContent='La publication n\'est pas disponible ici. Ouvre la boutique depuis ton compte Claude.';return;}
    draft.promos.forEach(function(p){p.code=String(p.code||'').trim().toUpperCase();});
    draft.testimonials=draft.testimonials.filter(function(x){return String(x.text||'').trim()&&String(x.name||'').trim();});
    draft.faq=draft.faq.filter(function(x){return String(x.q||'').trim();});
    t.disabled=true;st.textContent='Publication en cours…';
    artifactNs.publish(buildPage(draft)).then(function(){st.textContent='Publié. La boutique se recharge.';},function(err){
      t.disabled=false;var c=err&&err.code;
      if(c==='conflict')st.textContent='Une autre version vient d\'être publiée. La page se recharge : refais ta modification.';
      else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled')st.textContent='Cette vue est en lecture seule. Ouvre la boutique depuis ton compte Claude pour publier.';
      else if(c==='too_large')st.textContent='La boutique est trop lourde. Utilise des images plus légères.';
      else st.textContent='La publication a échoué. Réessaie dans un instant.';
    });
  }
}

/* ---------- boot ---------- */
fromHash();
render();
try{
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(ns){artifactNs=ns;},function(){});
    window.claude.use('user').then(function(u){
      if(!u)return;
      return u.canEdit().then(function(ok){if(ok){canEdit=true;render();}});
    },function(){});
  }
}catch(err){}
})();
</script>
</body>
</html>
